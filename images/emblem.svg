<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="55" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <circle cx="60" cy="60" r="48" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Open book (constructionism symbol) -->
  <!-- Left page -->
  <path d="M60 75 L32 68 L32 40 L60 47 Z"
        fill="rgba(255,255,255,0.09)"
        stroke="rgba(255,255,255,0.65)"
        stroke-width="1.2"
        stroke-linejoin="round"/>
  <!-- Right page -->
  <path d="M60 75 L88 68 L88 40 L60 47 Z"
        fill="rgba(255,255,255,0.06)"
        stroke="rgba(255,255,255,0.65)"
        stroke-width="1.2"
        stroke-linejoin="round"/>
  <!-- Spine -->
  <line x1="60" y1="47" x2="60" y2="75"
        stroke="rgba(255,255,255,0.75)"
        stroke-width="1.2"/>
  <!-- Page lines (left) -->
  <line x1="38" y1="52" x2="56" y2="55" stroke="rgba(255,255,255,0.25)" stroke-width="0.75"/>
  <line x1="38" y1="57" x2="56" y2="60" stroke="rgba(255,255,255,0.25)" stroke-width="0.75"/>
  <line x1="38" y1="62" x2="56" y2="65" stroke="rgba(255,255,255,0.25)" stroke-width="0.75"/>
  <!-- Page lines (right) -->
  <line x1="64" y1="55" x2="82" y2="52" stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>
  <line x1="64" y1="60" x2="82" y2="57" stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>
  <line x1="64" y1="65" x2="82" y2="62" stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>

  <!-- Network nodes (emergence from learning) -->
  <!-- Top node -->
  <circle cx="60" cy="22" r="4" fill="rgba(255,255,255,0.85)"/>
  <circle cx="60" cy="22" r="7" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <!-- Left cluster -->
  <circle cx="24" cy="38" r="3" fill="rgba(255,255,255,0.65)"/>
  <circle cx="16" cy="55" r="2.5" fill="rgba(255,255,255,0.45)"/>
  <circle cx="22" cy="72" r="2.5" fill="rgba(255,255,255,0.45)"/>
  <!-- Right cluster -->
  <circle cx="96" cy="38" r="3" fill="rgba(255,255,255,0.65)"/>
  <circle cx="104" cy="55" r="2.5" fill="rgba(255,255,255,0.45)"/>
  <circle cx="98" cy="72" r="2.5" fill="rgba(255,255,255,0.45)"/>
  <!-- Bottom nodes -->
  <circle cx="42" cy="96" r="2.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="78" cy="96" r="2.5" fill="rgba(255,255,255,0.4)"/>

  <!-- Edges: top to book -->
  <line x1="60" y1="29" x2="60" y2="47"
        stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <!-- Left edges -->
  <line x1="27" y1="39" x2="32" y2="46"
        stroke="rgba(255,255,255,0.25)" stroke-width="0.85"/>
  <line x1="16" y1="57" x2="24" y2="38"
        stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>
  <line x1="22" y1="70" x2="16" y2="57"
        stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>
  <line x1="22" y1="72" x2="32" y2="68"
        stroke="rgba(255,255,255,0.2)" stroke-width="0.75"/>
  <line x1="42" y1="94" x2="32" y2="75"
        stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>
  <!-- Right edges -->
  <line x1="93" y1="39" x2="88" y2="46"
        stroke="rgba(255,255,255,0.25)" stroke-width="0.85"/>
  <line x1="104" y1="57" x2="96" y2="38"
        stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>
  <line x1="98" y1="70" x2="104" y2="57"
        stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>
  <line x1="98" y1="72" x2="88" y2="68"
        stroke="rgba(255,255,255,0.2)" stroke-width="0.75"/>
  <line x1="78" y1="94" x2="88" y2="75"
        stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>
  <!-- Cross edges (depth) -->
  <line x1="60" y1="22" x2="24" y2="38"
        stroke="rgba(255,255,255,0.12)" stroke-width="0.75" stroke-dasharray="2.5 3"/>
  <line x1="60" y1="22" x2="96" y2="38"
        stroke="rgba(255,255,255,0.12)" stroke-width="0.75" stroke-dasharray="2.5 3"/>
  <line x1="42" y1="96" x2="78" y2="96"
        stroke="rgba(255,255,255,0.1)" stroke-width="0.75" stroke-dasharray="2 3"/>
</svg>
